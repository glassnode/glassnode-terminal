name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = engines.node minimum, 24 = development version.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      # pnpm-workspace.yaml enforces the build allowlist and the 7-day release-age cooldown.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      # Smoke test: the built CLI loads every module and exits at the credentials check.
      - name: Smoke test CLI
        run: |
          out=$(node dist/cli.js 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "no Glassnode credentials"
