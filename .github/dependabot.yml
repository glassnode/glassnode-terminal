version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match the pnpm-workspace.yaml release-age gate: only propose versions >= 7 days old.
    cooldown:
      default-days: 7
      # Repo author's own packages: take the latest immediately.
      exclude: [glassnode-api, ink-uplot]
    groups:
      # One PR per week for each dependency type's non-major bumps; majors stay separate for review.
      # A runtime PR changes what users install and needs a version bump (see CONTRIBUTING.md);
      # a development PR needs none and passes CI as opened.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
